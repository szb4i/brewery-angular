<div class="mat-elevation-z8">
  <table mat-table [dataSource]="dataSource">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>
    <ng-container matColumnDef="brewery_type">
      <th mat-header-cell *matHeaderCellDef> Brewery Type </th>
      <td mat-cell *matCellDef="let element"> {{element.brewery_type}} </td>
    </ng-container>
    <ng-container matColumnDef="country">
      <th mat-header-cell *matHeaderCellDef> Country </th>
      <td mat-cell *matCellDef="let element"> {{element.country}} </td>
    </ng-container>
    <ng-container matColumnDef="website_url">
      <th mat-header-cell *matHeaderCellDef> Website </th>
      <td mat-cell *matCellDef="let element"> {{element.website_url}} </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr 
      mat-row 
      *matRowDef="let row; columns: displayedColumns;"
      (click)="onRowClicked(row)"
    ></tr>
  </table>
  <mat-paginator [pageSizeOptions]="[10]"
                showFirstLastButtons 
                aria-label="Select page of periodic elements">
  </mat-paginator>
</div>
